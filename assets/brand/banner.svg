  <!-- wordmark -->
  <text x="224" y="172" font-family="Onest, 'Segoe UI', system-ui, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#e7e9ec">ilinxa</tspan><tspan fill="#5b6270">/</tspan><tspan fill="#a3e635">pro-ui</tspan>
  </text>
  <!-- tagline -->
  <text x="226" y="216" font-family="Onest, 'Segoe UI', system-ui, sans-serif" font-size="25" font-weight="500" fill="#99a1ac">Fully-composed shadcn/ui components — installed with the CLI, owned in your repo.</text>
  <!-- signal-lime baseline accent -->
  <rect x="0" y="314" width="1280" height="6" fill="#a3e635"/>
