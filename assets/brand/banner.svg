<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ilinxa/pro-ui — fully-composed shadcn/ui components">
  <!-- graphite-cool canvas (design token: oklch(0.13 0.006 250)) -->
  <rect width="1280" height="320" fill="#15171c"/>
  <!-- oversized tile-mark motif, faint, right side -->
  <g transform="translate(920,-40) scale(8)" opacity="0.05" fill="#e7e9ec">
    <rect x="6" y="6" width="16" height="16" rx="4"/>
    <rect x="26" y="6" width="16" height="16" rx="8"/>
    <rect x="6" y="26" width="16" height="16" rx="8"/>
    <rect x="26" y="26" width="16" height="16" rx="4"/>
  </g>
  <!-- the 2x2 tile mark (matches the registry-directory logo) -->
  <g transform="translate(96,112) scale(2)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#a3e635"/>
    <rect x="20" y="0" width="16" height="16" rx="8" fill="#e7e9ec"/>
    <rect x="0" y="20" width="16" height="16" rx="8" fill="#e7e9ec"/>
